# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    environment: Basket.API

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore src/eshop-microservices.slnx
    - name: Build
      run: dotnet build src/eshop-microservices.slnx --no-restore
    - name: Test
      run: dotnet test src/eshop-microservices.slnx --no-build --verbosity normal

    - name: Build and push Docker Image
      uses: mr-smithers-excellent/docker-build-push@v6
      with:
        image: kapilkaushal24/basket.api
        registry: docker.io
        dockerfile: src/Services/Basket/Basket.API/Dockerfile
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        tags: latest, master-${{ github.sha }}
